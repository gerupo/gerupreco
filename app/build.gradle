plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def appVersionCode = 14

android {
    namespace = 'com.vacari.gerupreco'

    compileSdk = 37

    // A chave e a senha estao versionadas no repositorio (key.jks e
    // readmeKey.txt). Isso permite gerar a release assinada pela linha de
    // comando, mas significa que qualquer pessoa com acesso ao repo assina
    // builds como se fossem oficiais - ver a secao Seguranca no CLAUDE.md.
    signingConfigs {
        release {
            storeFile = file('../key.jks')
            storePassword = 'facada123'
            keyAlias = 'gerupreco'
            keyPassword = 'facada123'
        }
    }

    defaultConfig {
        applicationId = "com.vacari.gerupreco"
        minSdk = 30
        targetSdk = 36
        versionCode = appVersionCode
        versionName = "3.2.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            versionNameSuffix = "-R"
            signingConfig = signingConfigs.release
        }
        debug {
            versionNameSuffix = "-T"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
}

// Substitui o antigo setProperty("archivesBaseName", ...) removido no AGP 9
base {
    archivesName = "app-v" + appVersionCode
}

dependencies {
    // UI Tradicional (XML)
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.activity:activity:1.13.0'

    // Firebase & Utilities
    implementation 'com.google.firebase:firebase-firestore:26.5.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Network & JSON
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'

    // Database
    implementation 'com.j256.ormlite:ormlite-android:6.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
